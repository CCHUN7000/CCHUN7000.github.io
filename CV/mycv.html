<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        card: '#ffffff',
                        background: '#f9fafb',
                        'text-dark': '#1f2937',
                        'text-muted': '#6b7280'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                } 
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="font-sans bg-background text-text-dark min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-primary mb-2">My Curriculum Vitae</h1>
            <p class="text-text-muted">Download or view my complete CV below</p>
        </header>

        <!-- CV Container -->
        <div class="bg-card border border-gray-200 rounded-xl shadow-lg overflow-hidden">
            <!-- PDF Viewer -->
            <div class="p-6">
                <!-- Direct PDF Embedding -->
                <div class="mb-6">
                    <embed src="CV-Chunbo Li.pdf" type="application/pdf" width="100%" height="2000vh" class="border border-gray-300 rounded-lg shadow-md">
                </div>
                
                <!-- Download Button -->
                <div class="flex justify-center space-x-4">
                    <a href="CV-Chunbo Li.pdf" download class="inline-flex items-center gap-2 bg-primary text-white px-6 py-3 rounded-lg font-medium hover:bg-primary/90 transition-colors">
                        <i class="fa fa-download"></i>
                        Download CV (PDF)
                    </a>
                    <a href="../Transcripts/myTranscripts.html" class="inline-flex items-center gap-2 bg-secondary text-white px-6 py-3 rounded-lg font-medium hover:bg-secondary/90 transition-colors">
                        <i class="fa fa-file-text-o"></i>
                        Transcript
                    </a>
                </div>
            </div>
        </div>

        <!-- Back Button -->
        <div class="mt-8 text-center">
            <a href="../index.html" class="inline-flex items-center gap-2 bg-gray-200 text-text-dark px-6 py-3 rounded-lg font-medium hover:bg-gray-300 transition-colors">
                <i class="fa fa-arrow-left"></i>
                Back to Homepage
            </a>
        </div>
    </div>
</body>
</html>
